spring.application.name=plazoleta-trazabilidad
server.port=${SERVER_PORT:8083}
# Carga opcional de un archivo .env local (copie .env.example a .env). Las variables de
# entorno del sistema siempre tienen prioridad sobre este archivo.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# MongoDB: la base y la colección se crean solas la primera vez que se guarda un registro.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/plazoleta_trazabilidad}

# Secretos obligatorios (los mismos de usuarios y restaurantes): la aplicación no arranca si faltan.
app.jwt.secret=${APP_JWT_SECRET}
app.internal.token=${USERS_INTERNAL_TOKEN}

# HU-18: restaurantes confirma quién es el dueño de un restaurante.
app.restaurants.base-url=${RESTAURANTS_SERVICE_BASE_URL:http://localhost:8080}

# Tiempo máximo para conectar y para recibir la respuesta de otro microservicio (503 si se cumple).
app.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:2s}
app.http.read-timeout=${HTTP_READ_TIMEOUT:5s}
